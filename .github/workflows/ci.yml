name: CI checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-test.txt
            shared/pyproject.toml

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r api/requirements-test.txt
          pip install -e shared

      - name: Run API tests
        working-directory: api
        run: python -m pytest tests -q

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            worker/requirements.txt
            worker/requirements-test.txt
            shared/pyproject.toml

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r worker/requirements.txt
          pip install -r worker/requirements-test.txt
          pip install -e shared

      - name: Run worker tests
        run: python -m pytest worker/tests -q

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backup-tests:
    name: Backup and restore tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse encrypted backup and restore
        run: |
          docker compose --env-file scripts/local.env -p race-photo-backup-test -f backup/compose.test.yml build tests
          docker compose --env-file scripts/local.env -p race-photo-backup-test -f backup/compose.test.yml up --abort-on-container-exit --exit-code-from tests
      - name: Stop disposable containers
        if: always()
        run: docker compose --env-file scripts/local.env -p race-photo-backup-test -f backup/compose.test.yml down
