name: Build & push images

on:
  push:
    branches: [dev, main]
    tags: ["v*"]

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-test.txt
            shared/pyproject.toml

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r api/requirements-test.txt
          pip install -e shared

      - name: Run API tests
        working-directory: api
        run: python -m pytest tests -q

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            worker/requirements.txt
            worker/requirements-test.txt
            shared/pyproject.toml

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r worker/requirements.txt
          pip install -r worker/requirements-test.txt
          pip install -e shared

      - name: Run worker tests
        run: python -m pytest worker/tests -q

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [api-tests, worker-tests, frontend-checks]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: api/Dockerfile
          - service: worker
            dockerfile: worker/Dockerfile
          - service: nginx
            dockerfile: nginx/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/race-photo-store" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for ARM64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: image_tags
        shell: bash
        run: |
          REF="${GITHUB_REF}"
          REF_NAME="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          SERVICE="${{ matrix.service }}"

          if [[ "$REF" == refs/tags/v* ]]; then
            printf "tags=%s/%s:%s,%s/%s:%s-%s\n" \
              "$IMAGE_PREFIX" "$SERVICE" "$REF_NAME" "$IMAGE_PREFIX" "$SERVICE" "$REF_NAME" "$SHORT_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == "refs/heads/main" ]]; then
            printf "tags=%s/%s:latest,%s/%s:main-%s\n" \
              "$IMAGE_PREFIX" "$SERVICE" "$IMAGE_PREFIX" "$SERVICE" "$SHORT_SHA" >> "$GITHUB_OUTPUT"
          else
            printf "tags=%s/%s:dev-latest,%s/%s:dev-%s\n" \
              "$IMAGE_PREFIX" "$SERVICE" "$IMAGE_PREFIX" "$SERVICE" "$SHORT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
