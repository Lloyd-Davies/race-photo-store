# Standalone local stack. Never merge this with production compose files.
name: race-photo-local
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://photostore:local-only-password@postgres:5432/photostore
  REDIS_URL: redis://redis:6379/0
  STORAGE_ROOT: /data/photos
  CACHE_ROOT: /data/photos/cache
  STORAGE_BACKEND: local
  ZIP_STORAGE_BACKEND: local
  PROOF_STORAGE_BACKEND: local
  ORIGINAL_STORAGE_BACKEND: local
  ADMIN_TOKEN: local-only-admin
  ADMIN_SESSION_SECRET: local-only-session-secret-not-for-production
  PUBLIC_BASE_URL: http://127.0.0.1:18081
  EMAIL_ENABLED: "false"
  BREVO_API_KEY: ""
  BREVO_WEBHOOK_SECRET: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  R2_ACCOUNT_ID: ""
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
  R2_ENDPOINT_URL: ""
  R2_PUBLIC_BASE_URL: ""
  SEO_SITE_URL: https://example.com
  SEO_LOGO_URL: https://example.com/favicon.svg
  SITE_NAME: Local synthetic photo store
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: photostore
      POSTGRES_USER: photostore
      POSTGRES_PASSWORD: local-only-password
    volumes: [local-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U photostore -d photostore"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [local-redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    image: race-photo-local-api:worktree
    build: {context: ., dockerfile: api/Dockerfile}
    environment: *app-env
    volumes: ["./.localdata/collaboration/photos:/data/photos"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 40
  worker:
    image: race-photo-local-worker:worktree
    build: {context: ., dockerfile: worker/Dockerfile}
    environment: *app-env
    volumes: ["./.localdata/collaboration/photos:/data/photos"]
    depends_on:
      api: {condition: service_healthy}
  worker-beat:
    image: race-photo-local-worker:worktree
    pull_policy: never
    command: [celery, -A, tasks, beat, --loglevel=info]
    environment: *app-env
    volumes: ["./.localdata/collaboration/photos:/data/photos"]
    depends_on:
      api: {condition: service_healthy}
  nginx:
    image: race-photo-local-nginx:worktree
    build: {context: ., dockerfile: nginx/Dockerfile}
    ports: ["127.0.0.1:18081:8080"]
    networks: [default, ingress]
    volumes: ["./.localdata/collaboration/photos:/srv/photos:ro"]
    depends_on:
      api: {condition: service_healthy}
networks:
  default:
    internal: true
  ingress: {}
volumes:
  local-postgres:
  local-redis:
