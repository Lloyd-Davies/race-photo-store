<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Browse and purchase photographs from running, athletics and sporting events." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Race Photos" />
    <meta property="og:title" content="Race Photos | Race and Event Photos" />
    <meta property="og:description" content="Browse and purchase photographs from running, athletics and sporting events." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Race Photos | Race and Event Photos" />
    <meta name="twitter:description" content="Browse and purchase photographs from running, athletics and sporting events." />
    <title>Race Photos | Race and Event Photos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Prevent flash of wrong theme -->
    <script>
      (function () {
        const stored = localStorage.getItem('theme')
        const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body class="bg-surface-950 text-content antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
